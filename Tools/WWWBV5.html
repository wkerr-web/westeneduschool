<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Westen Wide Web</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#05050c; --panel:#0b0b1a; --panel2:#13122c; --line:#25234d;
  --blue:#4f8bff; --blue-d:#2d54d6; --purple:#8b5cf6; --purple-d:#5b30c4;
  --ink:#e6e8ff; --muted:#8f93c4;
  --grad:linear-gradient(135deg,var(--blue),var(--purple));
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:Sora,'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--ink);display:flex;flex-direction:column;font-size:15px}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

.tabs{display:flex;align-items:flex-end;gap:4px;padding:8px 8px 0;background:#020207;overflow-x:auto;scrollbar-width:none}
.brand{font-weight:700;font-size:14px;padding:0 14px 9px 6px;white-space:nowrap;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.tab{display:flex;align-items:center;gap:8px;min-width:120px;max-width:200px;padding:8px 8px 8px 14px;background:var(--panel);border:1px solid var(--line);border-bottom:0;border-radius:10px 10px 0 0;color:var(--muted);cursor:pointer;flex:0 1 200px}
.tab.on{background:var(--panel2);color:var(--ink);box-shadow:inset 0 2px 0 var(--purple)}
.tab span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.tab button{background:none;border:0;border-radius:50%;width:22px;height:22px;line-height:1;padding:0}
.tab button:hover{background:rgba(139,92,246,.3)}
.plus{background:none;border:0;font-size:22px;color:var(--blue);padding:4px 10px 8px}

.bar{display:flex;gap:6px;align-items:center;padding:8px;background:var(--panel2)}
.ib{background:var(--panel);border:1px solid var(--line);border-radius:10px;width:36px;height:36px;font-size:17px;flex:none}
.ib:hover:not(:disabled){background:var(--purple-d);border-color:var(--purple)}
.ib:disabled{opacity:.3;cursor:default}
.addr{flex:1;display:flex;min-width:0}
.addr input{flex:1;min-width:0;height:36px;border-radius:18px 0 0 18px;border:1px solid var(--line);border-right:0;background:#07071a;color:var(--ink);padding:0 16px;font:inherit}
.addr input::placeholder{color:var(--muted)}
.addr button{height:36px;border-radius:0 18px 18px 0;border:0;background:var(--grad);color:#fff;font-weight:600;padding:0 18px}
.addr button:hover{filter:brightness(1.15)}

.marks{display:flex;gap:6px;padding:6px 8px;background:var(--panel);overflow-x:auto;scrollbar-width:none;min-height:38px;align-items:center;border-bottom:1px solid var(--line)}
.marks button{background:rgba(79,139,255,.08);border:1px solid var(--line);border-radius:14px;padding:3px 12px;white-space:nowrap;font-size:13px}
.marks button:hover{border-color:var(--blue);background:rgba(79,139,255,.18)}
.marks em{font-size:13px;color:var(--muted)}

.note{display:flex;gap:10px;align-items:center;justify-content:space-between;background:#1a1440;color:#c9c4ff;padding:6px 12px;font-size:13px}
.note[hidden]{display:none}
.note a{color:var(--blue);font-weight:600;white-space:nowrap}
.note button{background:none;border:0;font-size:18px}

.view{flex:1;min-height:0;position:relative;background:var(--bg)}
iframe{width:100%;height:100%;border:0;background:#fff;display:block}

/* home */
.home{height:100%;overflow:auto;background:radial-gradient(ellipse at 50% 0%,#1b1550 0%,var(--bg) 62%);display:flex;flex-direction:column;align-items:center;padding:6vh 20px 40px;text-align:center}
.rings{width:100px;height:100px;margin-bottom:16px}
.home h1{font-weight:700;font-size:clamp(32px,7vw,64px);line-height:1.05;margin:0;letter-spacing:-.02em;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.home p{margin:12px 0 28px;font-size:17px;color:var(--muted)}
.sf{display:flex;width:min(640px,100%);margin-bottom:12px}
.sf input{flex:1;min-width:0;height:52px;font:inherit;font-size:16px;padding:0 22px;border:1px solid var(--line);border-right:0;border-radius:26px 0 0 26px;background:#07071a;color:var(--ink)}
.sf input::placeholder{color:var(--muted)}
.sf button{height:52px;padding:0 26px;border:0;background:var(--grad);color:#fff;font-weight:600;border-radius:0 26px 26px 0}
.sf button:hover{filter:brightness(1.15)}
.eng{font-size:14px;color:var(--muted);margin-bottom:30px}
.eng select{font:inherit;background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:3px 6px}
.sec{width:min(760px,100%);text-align:left;margin:6px 0 10px;font-size:13px;font-weight:600;color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px;width:min(760px,100%);margin-bottom:22px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px 10px;font-size:14px;font-weight:500}
.tile:hover{border-color:var(--purple);background:var(--panel2);transform:translateY(-2px)}
.tile i{display:grid;place-items:center;width:42px;height:42px;margin:0 auto 10px;border-radius:12px;background:var(--grad);font-style:normal;font-weight:700;font-size:18px;color:#fff}

/* internal pages */
.page{height:100%;overflow:auto;padding:24px 24px 60px;background:radial-gradient(ellipse at 50% 0%,#15113d 0%,var(--bg) 55%)}
.page h2{margin:0 0 6px;font-size:26px;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;display:inline-block}
.page h3{font-size:15px;color:var(--muted);margin:26px 0 10px}
.page .lead{color:var(--muted);margin:0 0 18px}
.st{color:var(--muted);font-size:13px;min-height:20px;margin:8px 0}
.b{display:inline-block;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 14px;color:var(--ink);text-decoration:none;font-size:14px}
.b:hover{border-color:var(--purple);background:var(--purple-d)}
.b.pri{background:var(--grad);border:0;font-weight:600}
.row{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.sf2{display:flex;gap:8px;max-width:640px}
.sf2 input{flex:1;min-width:0}
input,textarea,select{background:#07071a;color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:9px 12px;font:inherit}
textarea{resize:vertical}

/* search results */
.sr{max-width:760px}
.ans{display:flex;gap:16px;background:var(--panel);border:1px solid var(--purple);border-radius:16px;padding:16px;margin:14px 0}
.ans img{width:120px;height:120px;object-fit:cover;border-radius:12px;flex:none;background:#111}
.ans h3{margin:0 0 6px;font-size:18px;color:var(--ink)}
.ans p{margin:0 0 10px;line-height:1.6}
.ans a,.rl a{color:var(--blue)}
.rl{display:block;padding:12px 0;border-bottom:1px solid var(--line)}
.rl a{font-weight:600;font-size:16px;text-decoration:none}
.rl a:hover{text-decoration:underline}
.rl p{margin:4px 0 0;color:var(--muted);font-size:14px;line-height:1.55}
@media (max-width:560px){.ans{flex-direction:column}}

/* images */
.igrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.ic{padding:0;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--panel);text-align:left}
.ic:hover{border-color:var(--purple)}
.ic img{display:block;width:100%;height:120px;object-fit:cover;background:#111}
.ic span{display:block;padding:7px 9px;font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.det{display:flex;gap:14px;align-items:center;background:var(--panel);border:1px solid var(--purple);border-radius:14px;padding:12px;margin:12px 0}
.det img{width:140px;height:100px;object-fit:cover;border-radius:10px}

/* creator */
.crh{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.chip{display:inline-flex;border:1px solid var(--line);border-radius:14px;overflow:hidden;margin:0 6px 6px 0;background:var(--panel)}
.chip button{background:none;border:0;padding:4px 10px;font-size:13px}
.chip button:hover{background:var(--purple-d)}
.cr{display:grid;grid-template-columns:minmax(300px,420px) 1fr;gap:18px;margin-top:14px}
.crf label{display:block;font-size:12px;color:var(--muted);margin-bottom:12px}
.crf input,.crf textarea,.crf select{width:100%;margin-top:4px}
.crf input[type=color]{padding:2px;height:38px}
.pre{display:flex;align-items:center;gap:6px;margin-top:4px}
.pre span{color:var(--muted);font-size:14px}
.pre input{margin-top:0}
.row3{display:grid;grid-template-columns:70px 1fr 1fr;gap:10px}
.crp{border:1px solid var(--line);border-radius:14px;overflow:hidden;min-height:480px;position:sticky;top:0;height:calc(100vh - 260px)}
@media (max-width:820px){.cr{grid-template-columns:1fr}.crp{position:static;height:460px}}

/* notes + arcade */
.pad{width:100%;max-width:760px;height:55vh;font-size:15px;line-height:1.6}
.ttt{display:grid;grid-template-columns:repeat(3,90px);gap:8px;margin:14px 0}
.ttt button{height:90px;font-size:38px;font-weight:700;background:var(--panel);border:1px solid var(--line);border-radius:14px}
.ttt button:hover:not(:disabled){border-color:var(--blue)}
.ttt .x{color:var(--blue)}.ttt .o{color:var(--purple)}
</style>
</head>
<body>
<div class="tabs" id="tabs" role="tablist"></div>
<div class="bar">
  <button class="ib" id="back" title="Back" aria-label="Back">←</button>
  <button class="ib" id="fwd" title="Forward" aria-label="Forward">→</button>
  <button class="ib" id="reload" title="Reload" aria-label="Reload">↻</button>
  <button class="ib" id="home" title="Home" aria-label="Home">⌂</button>
  <form class="addr" id="form"><input id="url" type="text" placeholder="Type a web address or search" autocomplete="off" spellcheck="false" aria-label="Address"><button>Go</button></form>
  <button class="ib" id="star" title="Bookmark this page" aria-label="Bookmark this page">☆</button>
</div>
<div class="marks" id="marks"></div>
<div class="note" id="note" hidden>
  <span>Page blank? Some sites don’t allow themselves to be shown inside other pages.</span>
  <span><a id="ext" href="#" target="_blank" rel="noopener noreferrer">Open in a new browser tab</a> <button id="closeNote" aria-label="Dismiss">×</button></span>
</div>
<div class="view" id="view"></div>

<script>
(function(){
  var HOME='www://home';
  var APPS=[
    {t:'Images',u:'www://images',i:'▣'},
    {t:'Website Creator',u:'www://creator',i:'✎'},
    {t:'Notes',u:'www://notes',i:'☰'},
    {t:'Arcade',u:'www://arcade',i:'◉'}
  ];
  var BUILTIN={home:'Home',images:'Images',creator:'Website Creator',notes:'Notes',arcade:'Arcade',search:'Search'};
  /* u:null means the search runs on the built-in Westen results page */
  var ENGINES={
    ddg:{n:'DuckDuckGo',u:null},
    wiki:{n:'Wikipedia',u:'https://en.wikipedia.org/w/index.php?search='}
  };
  var DEFAULT_MARKS=[
    APPS[0],APPS[1],
    {t:'Wikipedia',u:'https://en.wikipedia.org/wiki/Main_Page'},
    {t:'Wikimedia Commons',u:'https://commons.wikimedia.org'},
    {t:'Wikibooks',u:'https://en.wikibooks.org'},
    {t:'Wikivoyage',u:'https://en.wikivoyage.org'},
    {t:'Wikisource',u:'https://en.wikisource.org'},
    {t:'Wikinews',u:'https://en.wikinews.org'},
    {t:'Project Gutenberg',u:'https://www.gutenberg.org'},
    {t:'OpenStreetMap',u:'https://www.openstreetmap.org/export/embed.html'},
    {t:'Example',u:'https://example.com'}
  ];
  var marks=load('www_marks2',DEFAULT_MARKS), engine=load('www_engine2','ddg'), sites=load('www_sites',{});
  if(!ENGINES[engine]) engine='ddg';
  var tabs=[], cur=0, uid=0, armed=null, editing=null;
  var draft=blankDraft();

  function load(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
  function save(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}}
  var $=function(id){return document.getElementById(id)};
  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  function slugify(s){return String(s||'').toLowerCase().replace(/[^a-z0-9-]+/g,'-').replace(/^-+|-+$/g,'').slice(0,30)}
  function safeUrl(u){return /^https?:\/\//i.test(u)?u:''}
  function safeImg(u){return /^(https?:\/\/|data:image\/)/i.test(u||'')}
  function blankDraft(){return{slug:'',title:'My Website',heading:'Welcome to my website',tagline:'Built with the Website Creator',accent:'#8b5cf6',theme:'dark',font:'sans',layout:'center',body:'Write something about yourself, your project or your hobby here.\n\nLeave a blank line to start a new paragraph.',links:'Visit Wikipedia | https://en.wikipedia.org',img:''}}

  /* ---------- website builder ---------- */
  function buildSite(d){
    var dark=d.theme!=='light';
    var bg=dark?'#07070f':'#f6f5ff', fg=dark?'#e8e9ff':'#15142b', mu=dark?'#9a9dcc':'#55577e';
    var ac=/^#[0-9a-f]{6}$/i.test(d.accent)?d.accent:'#8b5cf6';
    var ff={sans:"'Segoe UI',system-ui,sans-serif",serif:"Georgia,'Times New Roman',serif",mono:"ui-monospace,Menlo,Consolas,monospace"}[d.font]||"system-ui,sans-serif";
    var paras=(d.body||'').split(/\n\s*\n/).map(function(p){p=p.trim();return p?'<p>'+esc(p).replace(/\n/g,'<br>')+'</p>':''}).join('');
    var btns=(d.links||'').split('\n').map(function(l){
      var a=l.split('|'); if(a.length<2) return '';
      var t=a[0].trim(), u=safeUrl(a.slice(1).join('|').trim());
      return (t&&u)?'<a class="btn" href="'+esc(u)+'" target="_blank" rel="noopener noreferrer">'+esc(t)+'</a>':'';
    }).join('');
    var im=safeImg(d.img)?'<img src="'+esc(d.img)+'" alt="">':'';
    var side=d.layout==='side';
    var css='*{box-sizing:border-box}body{margin:0;background:'+bg+';color:'+fg+';font-family:'+ff+';line-height:1.65}'
      +'.hero{padding:64px 24px 44px;background:linear-gradient(135deg,'+ac+'33,transparent 70%);text-align:'+(side?'left':'center')+'}'
      +'.in{max-width:'+(side?'1000px':'720px')+';margin:0 auto}'
      +'h1{font-size:clamp(30px,6vw,54px);line-height:1.1;margin:0 0 10px;color:'+ac+'}'
      +'.tag{font-size:19px;color:'+mu+';margin:0}'
      +'main{padding:30px 24px 50px}p{margin:0 0 16px;font-size:17px}'
      +'img{max-width:100%;border-radius:16px;display:block}'
      +'.center img{margin:0 auto 28px}'
      +'.grid{display:grid;grid-template-columns:1.2fr 1fr;gap:32px;align-items:start}'
      +'.btns{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}'
      +'.center .btns{justify-content:center}'
      +'.btn{background:'+ac+';color:#fff;text-decoration:none;padding:10px 18px;border-radius:10px;font-weight:600}'
      +'footer{text-align:center;color:'+mu+';font-size:13px;padding:24px}'
      +'@media(max-width:700px){.grid{grid-template-columns:1fr}}';
    var body;
    if(side){
      body='<header class="hero"><div class="in"><h1>'+esc(d.heading)+'</h1><p class="tag">'+esc(d.tagline)+'</p></div></header>'
        +'<main><div class="in grid"><div>'+paras+'<div class="btns">'+btns+'</div></div><div>'+im+'</div></div></main>';
    }else{
      body='<header class="hero"><div class="in"><h1>'+esc(d.heading)+'</h1><p class="tag">'+esc(d.tagline)+'</p></div></header>'
        +'<main><div class="in center">'+im+paras+'<div class="btns">'+btns+'</div></div></main>';
    }
    return '<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>'+esc(d.title)+'</title><style>'+css+'</style></head><body>'+body+'<footer>Made with the Website Creator on Westen Wide Web</footer></body></html>';
  }

  /* ---------- routing ---------- */
  function searchUrl(q){return 'www://search?q='+encodeURIComponent(q)}
  function searchQ(p){
    var m=p.match(/^search\?q=(.*)$/); if(!m) return '';
    try{return decodeURIComponent(m[1].replace(/\+/g,' '))}catch(e){return m[1]}
  }
  function isSearch(p){return p!==null&&(p==='search'||p.indexOf('search?')===0)}
  function normalize(raw){
    var s=raw.trim();
    if(!s) return HOME;
    if(s.toLowerCase().indexOf('www://')===0){
      var r=s.slice(6), qi=r.indexOf('?');
      var base=(qi<0?r:r.slice(0,qi)).toLowerCase().replace(/\/+$/,'');
      var p=base+(qi<0?'':r.slice(qi));
      return p?'www://'+p:HOME;
    }
    if(/^https?:\/\//i.test(s)) return s;
    if(!/\s/.test(s) && /^[^\s.]+\.[^\s]{2,}$|^localhost/i.test(s)) return 'https://'+s;
    var e=ENGINES[engine];
    return e.u?e.u+encodeURIComponent(s):searchUrl(s);
  }
  function pathOf(u){return u.indexOf('www://')===0?u.slice(6):null}
  function titleOf(u){
    var p=pathOf(u);
    if(p!==null){
      if(isSearch(p)){var q=searchQ(p);return q?q+' – Search':'Search'}
      return BUILTIN[p]||(sites[p]?sites[p].title:'Not found');
    }
    try{return new URL(u).hostname.replace(/^www\./,'')}catch(e){return u}
  }
  function T(){return tabs[cur]}
  function newTab(u){tabs.push({id:++uid,hist:[u||HOME],i:0});cur=tabs.length-1;render()}
  function closeTab(n){
    tabs.splice(n,1);
    if(!tabs.length){newTab();return}
    if(cur>=tabs.length) cur=tabs.length-1; else if(n<cur) cur--;
    render();
  }
  function go(raw){
    var t=T(), u=normalize(raw);
    t.hist=t.hist.slice(0,t.i+1); t.hist.push(u); t.i=t.hist.length-1; render();
  }

  /* ---------- chrome ---------- */
  function renderTabs(){
    var h='<div class="brand">Westen Wide Web</div>';
    tabs.forEach(function(t,n){
      h+='<div class="tab'+(n===cur?' on':'')+'" role="tab" tabindex="0" data-n="'+n+'"><span>'+esc(titleOf(t.hist[t.i]))+'</span><button data-x="'+n+'" aria-label="Close tab">×</button></div>';
    });
    h+='<button class="plus" id="plus" aria-label="New tab" title="New tab">+</button>';
    $('tabs').innerHTML=h;
  }
  function renderMarks(){
    var h=marks.length?'':'<em>No bookmarks yet. Tap ☆ to add one.</em>';
    marks.forEach(function(m,n){h+='<button data-m="'+n+'">'+esc(m.t)+'</button>'});
    $('marks').innerHTML=h;
  }

  /* ---------- home ---------- */
  function tileHTML(attr,t,letter){return '<button class="tile" '+attr+'><i>'+esc(letter)+'</i>'+esc(t)+'</button>'}
  function homeHTML(){
    var appUrls=APPS.map(function(a){return a.u});
    var apps=APPS.map(function(a){return tileHTML('data-u="'+a.u+'"',a.t,a.i)}).join('');
    var mine=Object.keys(sites).map(function(k){return tileHTML('data-u="www://'+esc(k)+'"',sites[k].title,sites[k].title.charAt(0).toUpperCase()||'W')}).join('');
    var bm=marks.map(function(m,n){return appUrls.indexOf(m.u)>=0?'':tileHTML('data-m="'+n+'"',m.t,m.t.charAt(0).toUpperCase())}).join('');
    var opts=Object.keys(ENGINES).map(function(k){return '<option value="'+k+'"'+(k===engine?' selected':'')+'>'+ENGINES[k].n+'</option>'}).join('');
    return '<div class="home">'
      +'<svg class="rings" viewBox="0 0 110 110" fill="none" aria-hidden="true"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4f8bff"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient></defs><circle cx="55" cy="55" r="50" stroke="url(#g)" stroke-width="2"/><ellipse cx="55" cy="55" rx="22" ry="50" stroke="url(#g)" stroke-width="2"/><ellipse cx="55" cy="55" rx="50" ry="20" stroke="url(#g)" stroke-width="2"/><circle cx="55" cy="55" r="6" fill="url(#g)"/></svg>'
      +'<h1>Westen Wide Web</h1><p>Search the web, browse images or build your own website.</p>'
      +'<form class="sf" id="hf"><input id="hq" type="text" placeholder="Search or type an address" aria-label="Search or type an address"><button>Search</button></form>'
      +'<label class="eng">Search with <select id="eng">'+opts+'</select></label>'
      +'<div class="sec">Westen apps</div><div class="tiles">'+apps+'</div>'
      +(mine?'<div class="sec">Your websites</div><div class="tiles">'+mine+'</div>':'')
      +(bm?'<div class="sec">Websites</div><div class="tiles">'+bm+'</div>':'')
      +'</div>';
  }

  /* ---------- search results ---------- */
  function searchHTML(q){
    return '<div class="page"><div class="sr"><h2>Search</h2>'
      +'<form class="sf2" id="sform"><input id="sq" type="text" value="'+esc(q)+'" placeholder="Search the web" aria-label="Search"><button class="b pri">Search</button></form>'
      +'<div class="st" id="sst"></div><div id="sout"></div></div></div>';
  }
  function linkTo(url,text){
    var u=safeUrl(url); if(!u) return esc(text);
    var inside=/^https:\/\/([a-z0-9-]+\.)*(wikipedia|wikimedia|wikibooks|wikivoyage|wikisource|wikinews|gutenberg)\.org\//i.test(u);
    return inside
      ?'<a href="'+esc(u)+'" data-u="'+esc(u)+'">'+esc(text)+'</a>'
      :'<a href="'+esc(u)+'" target="_blank" rel="noopener noreferrer">'+esc(text)+'</a>';
  }
  function plain(html){return new DOMParser().parseFromString(html||'','text/html').body.textContent||''}
  function bindSearch(q){
    $('sform').onsubmit=function(e){e.preventDefault();var v=$('sq').value.trim();if(v)go(searchUrl(v))};
    if(!q){$('sst').textContent='Type something above to search.';return}
    $('sst').textContent='Searching…';
    var ddgFull='https://duckduckgo.com/?q='+encodeURIComponent(q);
    var p1=fetch('https://api.duckduckgo.com/?q='+encodeURIComponent(q)+'&format=json&no_html=1&skip_disambig=1&t=westenwideweb')
      .then(function(r){return r.json()}).catch(function(){return null});
    var p2=fetch('https://en.wikipedia.org/w/api.php?action=query&list=search&srsearch='+encodeURIComponent(q)+'&srlimit=8&format=json&origin=*')
      .then(function(r){return r.json()}).catch(function(){return null});
    Promise.all([p1,p2]).then(function(a){
      var d=a[0], w=a[1], h='', found=false;
      var text=d&&(d.Answer||d.AbstractText||d.Definition);
      if(text){
        found=true;
        var img=d.Image?(d.Image.charAt(0)==='/'?'https://duckduckgo.com'+d.Image:d.Image):'';
        var src=d.AbstractURL||d.DefinitionURL||'';
        h+='<div class="ans">'+(safeImg(img)?'<img src="'+esc(img)+'" alt="" referrerpolicy="no-referrer">':'')
          +'<div><h3>'+esc(d.Heading||q)+'</h3><p>'+esc(text)+'</p>'
          +(src?'<div>'+linkTo(src,'Read more'+(d.AbstractSource?' on '+d.AbstractSource:''))+'</div>':'')+'</div></div>';
      }
      var rel=[];
      if(d&&d.RelatedTopics) d.RelatedTopics.forEach(function(t){
        if(t.Topics) rel=rel.concat(t.Topics); else rel.push(t);
      });
      rel=rel.filter(function(t){return t.Text&&t.FirstURL}).slice(0,6);
      if(rel.length){
        found=true; h+='<h3>Related topics</h3>';
        rel.forEach(function(t){h+='<div class="rl"><a href="'+esc(safeUrl(t.FirstURL))+'" target="_blank" rel="noopener noreferrer">'+esc(t.Text.length>110?t.Text.slice(0,110)+'…':t.Text)+'</a></div>'});
      }
      var arts=(w&&w.query&&w.query.search)||[];
      if(arts.length){
        found=true; h+='<h3>Articles</h3>';
        arts.forEach(function(r){
          var u='https://en.wikipedia.org/wiki/'+encodeURIComponent(r.title.replace(/ /g,'_'));
          h+='<div class="rl">'+linkTo(u,r.title)+'<p>'+esc(plain(r.snippet))+'…</p></div>';
        });
      }
      h='<div class="row"><a class="b pri" href="'+esc(ddgFull)+'" target="_blank" rel="noopener noreferrer">See full DuckDuckGo results</a></div>'+h;
      $('sst').textContent=found?'Results for “'+q+'”':'No quick results for “'+q+'”. Try the full DuckDuckGo results.';
      $('sout').innerHTML=h;
    });
  }

  /* ---------- images ---------- */
  var ART_NAMES=['Aurora','Nebula','Tidal','Ember','Glacier','Orbit','Twilight','Prism'];
  function art(n){
    var h1=(n*47+215)%360,h2=(h1+70)%360,s='';
    for(var k=0;k<6;k++){s+='<circle cx="'+((n*53+k*71)%400)+'" cy="'+((n*29+k*97)%300)+'" r="'+(20+((n+k)*13)%70)+'" fill="#fff" opacity=".11"/>'}
    var svg='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="hsl('+h1+',80%,48%)"/><stop offset="1" stop-color="hsl('+h2+',85%,22%)"/></linearGradient></defs><rect width="400" height="300" fill="url(#g)"/>'+s+'<path d="M0 230 Q100 '+(190+n*6)+' 200 230 T400 220 V300 H0Z" fill="#000" opacity=".28"/></svg>';
    return 'data:image/svg+xml;utf8,'+encodeURIComponent(svg);
  }
  var gallery=ART_NAMES.map(function(nm,i){var a=art(i);return{title:nm,thumb:a,full:a}});

  function imagesHTML(){
    return '<div class="page"><h2>Images</h2><p class="lead">Search free images from Wikimedia Commons, or pick from the Westen gallery. Use any image on your own website.</p>'
      +'<form class="sf2" id="if"><input id="iq" type="text" placeholder="Search images, like “mountain lake”" aria-label="Search images"><button class="b pri">Search</button></form>'
      +'<div class="st" id="ist"></div><div id="idet"></div><div class="igrid" id="ig"></div>'
      +'<h3>Westen gallery</h3><div class="igrid" id="gal"></div></div>';
  }
  function bindImages(){
    var res=[];
    function card(it,f,i){return '<button class="ic" data-f="'+f+'" data-i="'+i+'"><img src="'+esc(it.thumb)+'" alt="'+esc(it.title)+'" loading="lazy" referrerpolicy="no-referrer"><span>'+esc(it.title)+'</span></button>'}
    $('gal').innerHTML=gallery.map(function(it,i){return card(it,'gal',i)}).join('');
    function show(it){
      $('idet').innerHTML='<div class="det"><img src="'+esc(it.thumb)+'" alt=""><div><b>'+esc(it.title)+'</b><div class="row"><button class="b pri" id="useimg">Use in Website Creator</button>'
        +(it.full.indexOf('http')===0?'<a class="b" href="'+esc(it.full)+'" target="_blank" rel="noopener noreferrer">Open full image</a>':'')+'</div></div></div>';
      $('useimg').onclick=function(){draft.img=it.full;go('www://creator')};
    }
    function pick(e,list){
      var c=e.target.closest('.ic'); if(!c) return;
      show(list[+c.dataset.i]); $('idet').scrollIntoView({block:'nearest'});
    }
    $('gal').onclick=function(e){pick(e,gallery)};
    $('ig').onclick=function(e){pick(e,res)};
    $('if').onsubmit=function(e){
      e.preventDefault();
      var q=$('iq').value.trim(); if(!q) return;
      $('ist').textContent='Searching…';
      fetch('https://commons.wikimedia.org/w/api.php?action=query&generator=search&gsrsearch='+encodeURIComponent('filetype:bitmap '+q)+'&gsrnamespace=6&gsrlimit=24&prop=imageinfo&iiprop=url&iiurlwidth=420&format=json&origin=*')
        .then(function(r){return r.json()})
        .then(function(d){
          var pages=d.query?Object.keys(d.query.pages).map(function(k){return d.query.pages[k]}):[];
          pages.sort(function(a,b){return a.index-b.index});
          res=pages.filter(function(p){return p.imageinfo&&p.imageinfo[0]}).map(function(p){
            var ii=p.imageinfo[0];
            return{title:p.title.replace(/^File:/,'').replace(/\.[^.]+$/,''),thumb:ii.thumburl||ii.url,full:ii.url};
          });
          $('ist').textContent=res.length?res.length+' images for “'+q+'”. Select one to use it.':'No images found for “'+q+'”. Try different words.';
          $('ig').innerHTML=res.map(function(it,i){return card(it,'res',i)}).join('');
        })
        .catch(function(){$('ist').textContent='Couldn’t load results. Check your internet connection and try again.'});
    };
  }

  /* ---------- website creator ---------- */
  function opt(v,l,c){return '<option value="'+v+'"'+(v===c?' selected':'')+'>'+l+'</option>'}
  function creatorHTML(){
    var d=draft;
    var mine=Object.keys(sites).map(function(k){
      return '<span class="chip"><button data-open="'+esc(k)+'" title="Open">'+esc(k)+'</button><button data-edit="'+esc(k)+'" title="Edit">✎</button><button data-del="'+esc(k)+'" title="Delete">×</button></span>';
    }).join('');
    return '<div class="page"><div class="crh"><div><h2>Website Creator</h2><p class="lead" style="margin:0">Fill in the form, watch the preview, then save to publish your site at its own address.</p></div></div>'
      +(mine?'<h3>Your websites</h3><div>'+mine+'</div>':'')
      +'<div class="cr"><div class="crf">'
      +'<label>Website address<div class="pre"><span>www://</span><input id="f_slug" value="'+esc(d.slug)+'" placeholder="my-site" maxlength="30"></div></label>'
      +'<label>Site title (shown on the tab)<input id="f_title" value="'+esc(d.title)+'"></label>'
      +'<label>Headline<input id="f_heading" value="'+esc(d.heading)+'"></label>'
      +'<label>Tagline<input id="f_tagline" value="'+esc(d.tagline)+'"></label>'
      +'<div class="row3"><label>Accent<input id="f_accent" type="color" value="'+esc(d.accent)+'"></label>'
      +'<label>Style<select id="f_theme">'+opt('dark','Dark',d.theme)+opt('light','Light',d.theme)+'</select></label>'
      +'<label>Font<select id="f_font">'+opt('sans','Clean',d.font)+opt('serif','Classic',d.font)+opt('mono','Code',d.font)+'</select></label></div>'
      +'<label>Layout<select id="f_layout">'+opt('center','Centered',d.layout)+opt('side','Text with image on the side',d.layout)+'</select></label>'
      +'<label>Text (blank line starts a new paragraph)<textarea id="f_body" rows="7">'+esc(d.body)+'</textarea></label>'
      +'<label>Buttons (one per line, like Label | https://address)<textarea id="f_links" rows="3">'+esc(d.links)+'</textarea></label>'
      +'<label>Image<input id="f_img" value="'+esc(d.img.indexOf('data:')===0?'[selected image]':d.img)+'" placeholder="Image address (https://…)"></label>'
      +'<div class="row"><label class="b" style="margin:0;color:var(--ink);font-size:14px">Upload from device<input type="file" id="f_file" accept="image/*" hidden></label><button class="b" id="pickimg">Find an image</button><button class="b" id="clearimg">Remove image</button></div>'
      +'<div class="row"><button class="b pri" id="save">Save and open</button><button class="b" id="dl">Download HTML</button><button class="b" id="fresh">Start over</button></div>'
      +'<div class="st" id="cst"></div></div>'
      +'<div class="crp"><iframe id="prev" title="Website preview" sandbox="allow-popups allow-popups-to-escape-sandbox"></iframe></div></div></div>';
  }
  function bindCreator(){
    var timer;
    function preview(){clearTimeout(timer);timer=setTimeout(function(){$('prev').srcdoc=buildSite(draft)},120)}
    function msg(t){$('cst').textContent=t}
    ['slug','title','heading','tagline','accent','theme','font','layout','body','links','img'].forEach(function(k){
      var el=$('f_'+k);
      var h=function(){
        if(k==='img'&&el.value==='[selected image]') return;
        draft[k]=el.value; preview();
      };
      el.oninput=h; el.onchange=h;
    });
    $('f_slug').onblur=function(){this.value=draft.slug=slugify(this.value)};
    $('f_file').onchange=function(){
      var f=this.files[0]; if(!f) return;
      var r=new FileReader();
      r.onload=function(){
        var im=new Image();
        im.onload=function(){
          var s=Math.min(1,900/Math.max(im.width,im.height)), c=document.createElement('canvas');
          c.width=Math.round(im.width*s); c.height=Math.round(im.height*s);
          c.getContext('2d').drawImage(im,0,0,c.width,c.height);
          draft.img=c.toDataURL('image/jpeg',.82); $('f_img').value='[selected image]'; preview(); msg('Image added.');
        };
        im.onerror=function(){msg('That file couldn’t be read as an image.')};
        im.src=r.result;
      };
      r.readAsDataURL(f);
    };
    $('pickimg').onclick=function(){go('www://images')};
    $('clearimg').onclick=function(){draft.img='';$('f_img').value='';preview()};
    $('fresh').onclick=function(){draft=blankDraft();editing=null;render()};
    $('dl').onclick=function(){
      var blob=new Blob([buildSite(draft)],{type:'text/html'}), a=document.createElement('a');
      a.href=URL.createObjectURL(blob); a.download=(slugify(draft.slug)||'website')+'.html';
      document.body.appendChild(a); a.click(); a.remove(); msg('Downloaded as '+a.download+'.');
    };
    $('save').onclick=function(){
      var slug=slugify(draft.slug);
      if(slug.length<2){msg('Choose a website address with at least 2 letters or numbers.');return}
      if(BUILTIN[slug]){msg('“'+slug+'” is used by Westen Wide Web. Choose another address.');return}
      if(sites[slug]&&slug!==editing){msg('That address is taken. Choose another one.');return}
      var copy=JSON.parse(JSON.stringify(draft)); copy.slug=slug;
      var old=sites[slug], oldEdit=editing&&sites[editing];
      if(editing&&editing!==slug) delete sites[editing];
      sites[slug]=copy;
      if(!save('www_sites',sites)){
        delete sites[slug]; if(oldEdit) sites[editing]=oldEdit; if(old) sites[slug]=old;
        msg('Couldn’t save. The image may be too large. Try a smaller one.');return;
      }
      editing=slug; go('www://'+slug);
    };
    var mine=document.querySelectorAll('[data-open],[data-edit],[data-del]');
    Array.prototype.forEach.call(mine,function(b){
      b.onclick=function(){
        if(b.dataset.open) go('www://'+b.dataset.open);
        else if(b.dataset.edit){draft=JSON.parse(JSON.stringify(sites[b.dataset.edit]));editing=b.dataset.edit;armed=null;render()}
        else{
          var k=b.dataset.del;
          if(armed===k){delete sites[k];save('www_sites',sites);if(editing===k)editing=null;armed=null;render()}
          else{armed=k;msg('Select × again to delete “'+k+'”.')}
        }
      };
    });
    preview();
  }

  /* ---------- notes ---------- */
  function notesHTML(){
    return '<div class="page"><h2>Notes</h2><p class="lead">Saved automatically in this browser.</p><textarea class="pad" id="pad" placeholder="Start typing…" aria-label="Notes"></textarea><div class="st" id="pst"></div></div>';
  }
  function bindNotes(){
    var pad=$('pad'); pad.value=load('www_notes','');
    function count(){var w=pad.value.trim()?pad.value.trim().split(/\s+/).length:0;$('pst').textContent=w+(w===1?' word':' words')}
    pad.oninput=function(){save('www_notes',pad.value);count()}; count();
  }

  /* ---------- arcade ---------- */
  var LINES=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
  var score={you:0,cpu:0,draw:0};
  function arcadeHTML(){
    return '<div class="page"><h2>Arcade</h2><p class="lead">Tic-tac-toe. You are X and you go first.</p><div class="ttt" id="ttt"></div><div class="st" id="tst"></div><button class="b" id="tnew">New game</button><div class="st" id="tsc"></div></div>';
  }
  function bindArcade(){
    var b,over;
    function win(bd){
      for(var i=0;i<LINES.length;i++){var l=LINES[i];if(bd[l[0]]&&bd[l[0]]===bd[l[1]]&&bd[l[0]]===bd[l[2]])return bd[l[0]]}
      return bd.every(Boolean)?'draw':null;
    }
    function find(p){
      for(var i=0;i<LINES.length;i++){
        var l=LINES[i],v=l.map(function(x){return b[x]});
        if(v.filter(function(x){return x===p}).length===2&&v.indexOf('')>=0) return l[v.indexOf('')];
      }
      return -1;
    }
    function ai(){
      var m=find('O'); if(m<0) m=find('X');
      if(m<0&&!b[4]) m=4;
      if(m<0){var e=[];b.forEach(function(v,i){if(!v)e.push(i)});m=e[Math.floor(Math.random()*e.length)]}
      b[m]='O';
    }
    function draw(){
      $('ttt').innerHTML=b.map(function(v,i){return '<button data-c="'+i+'" class="'+(v==='X'?'x':'o')+'"'+(v||over?' disabled':'')+' aria-label="Square '+(i+1)+'">'+v+'</button>'}).join('');
      $('tsc').textContent='You '+score.you+' · Computer '+score.cpu+' · Draws '+score.draw;
    }
    function end(r){
      over=true;
      if(r==='X'){score.you++;$('tst').textContent='You win!'}
      else if(r==='O'){score.cpu++;$('tst').textContent='The computer wins.'}
      else{score.draw++;$('tst').textContent='It’s a draw.'}
    }
    function reset(){b=['','','','','','','','',''];over=false;$('tst').textContent='Your move.';draw()}
    $('ttt').onclick=function(e){
      var c=e.target.closest('[data-c]'); if(!c||over) return;
      b[+c.dataset.c]='X';
      var r=win(b); if(!r){ai();r=win(b)}
      if(r) end(r);
      draw();
    };
    $('tnew').onclick=reset; reset();
  }

  /* ---------- main render ---------- */
  function notFoundHTML(p){
    return '<div class="page"><h2>Page not found</h2><p class="lead">There is no website at <b>www://'+esc(p)+'</b>.</p><div class="row"><button class="b pri" data-u="www://creator">Create it in the Website Creator</button><button class="b" data-u="'+HOME+'">Go home</button></div></div>';
  }
  function render(){
    var t=T(), u=t.hist[t.i], p=pathOf(u), view=$('view');
    renderTabs(); renderMarks();
    $('url').value=(u===HOME)?'':(isSearch(p)?searchQ(p):u);
    $('back').disabled=t.i<=0; $('fwd').disabled=t.i>=t.hist.length-1;
    $('star').textContent=marks.some(function(m){return m.u===u})?'★':'☆';
    $('star').disabled=(u===HOME);
    document.title=(u===HOME?'':titleOf(u)+' · ')+'Westen Wide Web';
    if(p!==null){
      $('note').hidden=true;
      if(p==='home'||p===''){view.innerHTML=homeHTML();
        $('hf').onsubmit=function(e){e.preventDefault();var q=$('hq').value;if(q.trim())go(q)};
        $('eng').onchange=function(e){engine=e.target.value;save('www_engine2',engine)};
      }else if(isSearch(p)){var q=searchQ(p);view.innerHTML=searchHTML(q);bindSearch(q)}
      else if(p==='images'){view.innerHTML=imagesHTML();bindImages()}
      else if(p==='creator'){view.innerHTML=creatorHTML();bindCreator()}
      else if(p==='notes'){view.innerHTML=notesHTML();bindNotes()}
      else if(p==='arcade'){view.innerHTML=arcadeHTML();bindArcade()}
      else if(sites[p]){
        view.innerHTML='';
        var f=document.createElement('iframe');
        f.title=sites[p].title; f.setAttribute('sandbox','allow-popups allow-popups-to-escape-sandbox');
        f.srcdoc=buildSite(sites[p]); view.appendChild(f);
      }else view.innerHTML=notFoundHTML(p);
    }else{
      view.innerHTML='';
      var fr=document.createElement('iframe');
      fr.title=titleOf(u); fr.src=u;
      fr.setAttribute('referrerpolicy','no-referrer');
      fr.setAttribute('sandbox','allow-scripts allow-forms allow-same-origin allow-popups allow-popups-to-escape-sandbox');
      view.appendChild(fr);
      $('ext').href=u; $('note').hidden=false;
    }
  }

  document.addEventListener('click',function(e){
    var el=e.target.closest('[data-x],[data-n],[data-m],[data-u],#plus');
    if(!el) return;
    if(el.tagName==='A') e.preventDefault();
    if(el.dataset.x!==undefined){e.stopPropagation();closeTab(+el.dataset.x)}
    else if(el.dataset.n!==undefined){cur=+el.dataset.n;render()}
    else if(el.dataset.m!==undefined){go(marks[+el.dataset.m].u)}
    else if(el.dataset.u!==undefined){go(el.dataset.u)}
    else if(el.id==='plus'){newTab()}
  });
  $('tabs').addEventListener('keydown',function(e){
    if((e.key==='Enter'||e.key===' ')&&e.target.dataset.n!==undefined){e.preventDefault();cur=+e.target.dataset.n;render()}
  });
  $('form').onsubmit=function(e){e.preventDefault();go($('url').value);$('url').blur()};
  $('back').onclick=function(){var t=T();if(t.i>0){t.i--;render()}};
  $('fwd').onclick=function(){var t=T();if(t.i<t.hist.length-1){t.i++;render()}};
  $('reload').onclick=function(){render()};
  $('home').onclick=function(){go(HOME)};
  $('closeNote').onclick=function(){$('note').hidden=true};
  $('url').addEventListener('focus',function(){this.select()});
  $('star').onclick=function(){
    var u=T().hist[T().i];
    var n=marks.findIndex(function(m){return m.u===u});
    if(n>=0) marks.splice(n,1); else marks.push({t:titleOf(u),u:u});
    save('www_marks2',marks); render();
  };
  document.addEventListener('keydown',function(e){
    if((e.ctrlKey||e.metaKey)&&e.key==='l'){e.preventDefault();$('url').focus()}
    if((e.ctrlKey||e.metaKey)&&e.key==='t'){e.preventDefault();newTab()}
  });

  newTab();
})();
</script>
