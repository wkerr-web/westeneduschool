<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Westen Wide Web</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#05050c; --panel:#0b0b1a; --panel2:#13122c; --line:#25234d;
  --blue:#4f8bff; --blue-d:#2d54d6; --purple:#8b5cf6; --purple-d:#5b30c4;
  --ink:#e6e8ff; --muted:#8f93c4;
  --grad:linear-gradient(135deg,var(--blue),var(--purple));
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:Sora,'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--ink);display:flex;flex-direction:column;font-size:15px}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

.tabs{display:flex;align-items:flex-end;gap:4px;padding:8px 8px 0;background:#020207;overflow-x:auto;scrollbar-width:none}
.brand{font-weight:700;font-size:14px;padding:0 14px 9px 6px;white-space:nowrap;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.tab{display:flex;align-items:center;gap:8px;min-width:120px;max-width:200px;padding:8px 8px 8px 14px;background:var(--panel);border:1px solid var(--line);border-bottom:0;border-radius:10px 10px 0 0;color:var(--muted);cursor:pointer;flex:0 1 200px}
.tab.on{background:var(--panel2);color:var(--ink);box-shadow:inset 0 2px 0 var(--purple)}
.tab span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.tab button{background:none;border:0;border-radius:50%;width:22px;height:22px;line-height:1;padding:0}
.tab button:hover{background:rgba(139,92,246,.3)}
.plus{background:none;border:0;font-size:22px;color:var(--blue);padding:4px 10px 8px}

.bar{display:flex;gap:6px;align-items:center;padding:8px;background:var(--panel2)}
.ib{background:var(--panel);border:1px solid var(--line);border-radius:10px;width:36px;height:36px;font-size:17px;flex:none}
.ib:hover:not(:disabled){background:var(--purple-d);border-color:var(--purple)}
.ib:disabled{opacity:.3;cursor:default}
.addr{flex:1;display:flex;min-width:0}
.addr input{flex:1;min-width:0;height:36px;border-radius:18px 0 0 18px;border:1px solid var(--line);border-right:0;background:#07071a;color:var(--ink);padding:0 16px;font:inherit}
.addr input::placeholder{color:var(--muted)}
.addr button{height:36px;border-radius:0 18px 18px 0;border:0;background:var(--grad);color:#fff;font-weight:600;padding:0 18px}
.addr button:hover{filter:brightness(1.15)}

.marks{display:flex;gap:6px;padding:6px 8px;background:var(--panel);overflow-x:auto;scrollbar-width:none;min-height:38px;align-items:center;border-bottom:1px solid var(--line)}
.marks button{background:rgba(79,139,255,.08);border:1px solid var(--line);border-radius:14px;padding:3px 12px;white-space:nowrap;font-size:13px}
.marks button:hover{border-color:var(--blue);background:rgba(79,139,255,.18)}
.marks em{font-size:13px;color:var(--muted)}

.note{display:flex;gap:10px;align-items:center;justify-content:space-between;background:#1a1440;color:#c9c4ff;padding:6px 12px;font-size:13px}
.note[hidden]{display:none}
.note a{color:var(--blue);font-weight:600;white-space:nowrap}
.note button{background:none;border:0;font-size:18px}

.view{flex:1;min-height:0;position:relative;background:var(--bg)}
iframe{width:100%;height:100%;border:0;background:#fff;display:block}

/* home */
.home{height:100%;overflow:auto;background:radial-gradient(ellipse at 50% 0%,#1b1550 0%,var(--bg) 62%);display:flex;flex-direction:column;align-items:center;padding:6vh 20px 40px;text-align:center}
.rings{width:100px;height:100px;margin-bottom:16px}
.home h1{font-weight:700;font-size:clamp(32px,7vw,64px);line-height:1.05;margin:0;letter-spacing:-.02em;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.home p{margin:12px 0 28px;font-size:17px;color:var(--muted)}
.sf{display:flex;width:min(640px,100%);margin-bottom:12px}
.sf input{flex:1;min-width:0;height:52px;font:inherit;font-size:16px;padding:0 22px;border:1px solid var(--line);border-right:0;border-radius:26px 0 0 26px;background:#07071a;color:var(--ink)}
.sf input::placeholder{color:var(--muted)}
.sf button{height:52px;padding:0 26px;border:0;background:var(--grad);color:#fff;font-weight:600;border-radius:0 26px 26px 0}
.sf button:hover{filter:brightness(1.15)}
.eng{font-size:14px;color:var(--muted);margin-bottom:30px}
.eng select{font:inherit;background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:3px 6px}
.sec{width:min(760px,100%);text-align:left;margin:6px 0 10px;font-size:13px;font-weight:600;color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px;width:min(760px,100%);margin-bottom:22px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px 10px;font-size:14px;font-weight:500}
.tile:hover{border-color:var(--purple);background:var(--panel2);transform:translateY(-2px)}
.tile i{display:grid;place-items:center;width:42px;height:42px;margin:0 auto 10px;border-radius:12px;background:var(--grad);font-style:normal;font-weight:700;font-size:18px;color:#fff}

/* internal pages */
.page{height:100%;overflow:auto;padding:24px 24px 60px;background:radial-gradient(ellipse at 50% 0%,#15113d 0%,var(--bg) 55%)}
.page h2{margin:0 0 6px;font-size:26px;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;display:inline-block}
.page h3{font-size:15px;color:var(--muted);margin:26px 0 10px}
.page .lead{color:var(--muted);margin:0 0 18px}
.st{color:var(--muted);font-size:13px;min-height:20px;margin:8px 0}
.b{display:inline-block;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 14px;color:var(--ink);text-decoration:none;font-size:14px}
.b:hover{border-color:var(--purple);background:var(--purple-d)}
.b.pri{background:var(--grad);border:0;font-weight:600}
.row{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.sf2{display:flex;gap:8px;max-width:640px}
.sf2 input{flex:1;min-width:0}
input,textarea,select{background:#07071a;color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:9px 12px;font:inherit}
textarea{resize:vertical}

/* images */
.igrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.ic{padding:0;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--panel);text-align:left}
.ic:hover{border-color:var(--purple)}
.ic img{display:block;width:100%;height:120px;object-fit:cover;background:#111}
.ic span{display:block;padding:7px 9px;font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.det{display:flex;gap:14px;align-items:center;background:var(--panel);border:1px solid var(--purple);border-radius:14px;padding:12px;margin:12px 0}
.det img{width:140px;height:100px;object-fit:cover;border-radius:10px}

/* creator */
.crh{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.chip{display:inline-flex;border:1px solid var(--line);border-radius:14px;overflow:hidden;margin:0 6px 6px 0;background:var(--panel)}
.chip button{background:none;border:0;padding:4px 10px;font-size:13px}
.chip button:hover{background:var(--purple-d)}
.cr{display:grid;grid-template-columns:minmax(300px,420px) 1fr;gap:18px;margin-top:14px}
.crf label{display:block;font-size:12px;color:var(--muted);margin-bottom:12px}
.crf input,.crf textarea,.crf select{width:100%;margin-top:4px}
.crf input[type=color]{padding:2px;height:38px}
.pre{display:flex;align-items:center;gap:6px;margin-top:4px}
.pre span{color:var(--muted);font-size:14px}
.pre input{margin-top:0}
.row3{display:grid;grid-template-columns:70px 1fr 1fr;gap:10px}
.crp{border:1px solid var(--line);border-radius:14px;overflow:hidden;min-height:480px;position:sticky;top:0;height:calc(100vh - 260px)}
@media (max-width:820px){.cr{grid-template-columns:1fr}.crp{position:static;height:460px}}

/* notes + arcade */
.pad{width:100%;max-width:760px;height:55vh;font-size:15px;line-height:1.6}
.ttt{display:grid;grid-template-columns:repeat(3,90px);gap:8px;margin:14px 0}
.ttt button{height:90px;font-size:38px;font-weight:700;background:var(--panel);border:1px solid var(--line);border-radius:14px}
.ttt button:hover:not(:disabled){border-color:var(--blue)}
.ttt .x{color:var(--blue)}.ttt .o{color:var(--purple)}
</style>
</head>
<body>
<div class="tabs" id="tabs" role="tablist"></div>
<div class="bar">
  <button class="ib" id="back" title="Back" aria-label="Back">←</button>
  <button class="ib" id="fwd" title="Forward" aria-label="Forward">→</button>
  <button class="ib" id="reload" title="Reload" aria-label="Reload">↻</button>
  <button class="ib" id="home" title="Home" aria-label="Home">⌂</button>
  <form class="addr" id="form"><input id="url" type="text" placeholder="Type a web address or search" autocomplete="off" spellcheck="false" aria-label="Address"><button>Go</button></form>
  <button class="ib" id="star" title="Bookmark this page" aria-label="Bookmark this page">☆</button>
</div>
<div class="marks" id="marks"></div>
<div class="note" id="note" hidden>
  <span>Page blank? Some sites don’t allow themselves to be shown inside other pages.</span>
  <span><a id="ext" href="#" target="_blank" rel="noopener noreferrer">Open in a new browser tab</a> <button id="closeNote" aria-label="Dismiss">×</button></span>
</div>
<div class="view" id="view"></div>

<script>
(function(){
  var HOME='www://home';
  var APPS=[
    {t:'Images',u:'www://images',i:'▣'},
    {t:'Website Creator',u:'www://creator',i:'✎'},
    {t:'Notes',u:'www://notes',i:'☰'},
    {t:'Arcade',u:'www://arcade',i:'◉'}
  ];
  var BUILTIN={home:'Home',images:'Images',creator:'Website Creator',notes:'Notes',arcade:'Arcade'};
  var ENGINES={
    wiki:{n:'Wikipedia',u:'https://en.wikipedia.org/w/index.php?search='},
    ddg:{n:'DuckDuckGo',u:'https://duckduckgo.com/?q='},
    bing:{n:'Bing',u:'https://www.bing.com/search?q='}
  };
  var DEFAULT_MARKS=[
    APPS[0],APPS[1],
    {t:'Wikipedia',u:'https://en.wikipedia.org/wiki/Main_Page'},
    {t:'Wikimedia Commons',u:'https://commons.wikimedia.org'},
    {t:'Wikibooks',u:'https://en.wikibooks.org'},
    {t:'Wikivoyage',u:'https://en.wikivoyage.org'},
    {t:'Wikisource',u:'https://en.wikisource.org'},
    {t:'Wikinews',u:'https://en.wikinews.org'},
    {t:'Project Gutenberg',u:'https://www.gutenberg.org'},
    {t:'OpenStreetMap',u:'https://www.openstreetmap.org/export/embed.html'},
    {t:'Example',u:'https://example.com'}
  ];
  var marks=load('www_marks2',DEFAULT_MARKS), engine=load('www_engine','wiki'), sites=load('www_sites',{});
  var tabs=[], cur=0, uid=0, armed=null, editing=null;
  var draft=blankDraft();

  function load(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
  function save(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}}
  var $=function(id){return document.getElementById(id)};
  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  function slugify(s){return String(s||'').toLowerCase().replace(/[^a-z0-9-]+/g,'-').replace(/^-+|-+$/g,'').slice(0,30)}
  function safeUrl(u){return /^https?:\/\//i.test(u)?u:''}
  function safeImg(u){return /^(https?:\/\/|data:image\/)/i.test(u||'')}
  function blankDraft(){return{slug:'',title:'My Website',heading:'Welcome to my website',tagline:'Built with the Website Creator',accent:'#8b5cf6',theme:'dark',font:'sans',layout:'center',body:'Write something about yourself, your project or your hobby here.\n\nLeave a blank line to start a new paragraph.',links:'Visit Wikipedia | https://en.wikipedia.org',img:''}}

  /* ---------- website builder ---------- */
  function buildSite(d){
    var dark=d.theme!=='light';
    var bg=dark?'#07070f':'#f6f5ff', fg=dark?'#e8e9ff':'#15142b', mu=dark?'#9a9dcc':'#55577e';
    var ac=/^#[0-9a-f]{6}$/i.test(d.accent)?d.accent:'#8b5cf6';
    var ff={sans:"'Segoe UI',system-ui,sans-serif",serif:"Georgia,'Times New Roman',serif",mono:"ui-monospace,Menlo,Consolas,monospace"}[d.font]||"system-ui,sans-serif";
    var paras=(d.body||'').split(/\n\s*\n/).map(function(p){p=p.trim();return p?'<p>'+esc(p).replace(/\n/g,'<br>')+'</p>':''}).join('');
    var btns=(d.links||'').split('\n').map(function(l){
      var a=l.split('|'); if(a.length<2) return '';
      var t=a[0].trim(), u=safeUrl(a.slice(1).join('|').trim());
      return (t&&u)?'<a class="btn" href="'+esc(u)+'" target="_blank" rel="noopener noreferrer">'+esc(t)+'</a>':'';
    }).join('');
    var im=safeImg(d.img)?'<img src="'+esc(d.img)+'" alt="">':'';
    var side=d.layout==='side';
    var css='*{box-sizing:border-box}body{margin:0;background:'+bg+';color:'+fg+';font-family:'+ff+';line-height:1.65}'
      +'.hero{padding:64px 24px 44px;background:linear-gradient(135deg,'+ac+'33,transparent 70%);text-align:'+(side?'left':'center')+'}'
      +'.in{max-width:'+(side?'1000px':'720px')+';margin:0 auto}'
      +'h1{font-size:clamp(30px,6vw,54px);line-height:1.1;margin:0 0 10px;color:'+ac+'}'
      +'.tag{font-size:19px;color:'+mu+';margin:0}'
      +'main{padding:30px 24px 50px}p{margin:0 0 16px;font-size:17px}'
      +'img{max-width:100%;border-radius:16px;display:block}'
      +'.center img{margin:0 auto 28px}'
      +'.grid{display:grid;grid-template-columns:1.2fr 1fr;gap:32px;align-items:start}'
      +'.btns{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}'
      +'.center .btns{justify-content:center}'
      +'.btn{background:'+ac+';color:#fff;text-decoration:none;padding:10px 18px;border-radius:10px;font-weight:600}'
      +'footer{text-align:center;color:'+mu+';font-size:13px;padding:24px}'
      +'@media(max-width:700px){.grid{grid-template-columns:1fr}}';
    var body;
    if(side){
      body='<header class="hero"><div class="in"><h1>'+esc(d.heading)+'</h1><p class="tag">'+esc(d.tagline)+'</p></div></header>'
        +'<main><div class="in grid"><div>'+paras+'<div class="btns">'+btns+'</div></div><div>'+im+'</div></div></main>';
    }else{
      body='<header class="hero"><div class="in"><h1>'+esc(d.heading)+'</h1><p class="tag">'+esc(d.tagline)+'</p></div></header>'
        +'<main><div
